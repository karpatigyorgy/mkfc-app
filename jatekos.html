<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MKFC – Játékos Központ</title>

  <meta name="theme-color" content="#174a73">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      min-height: 100vh;
    }

    .header {
      background: #174a73;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .content {
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .nev {
      font-size: 20px;
      font-weight: bold;
      color: #174a73;
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #174a73;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    MKFC – Játékos Központ
  </div>

  <div class="content">
    <div class="card">
      <div class="nev" id="jatekosNev">
        Betöltés...
      </div>

      <div>
        Sikeres belépés.
      </div>
    </div>
    
   <div class="card" id="kovetkezoEsemeny">
  <div class="nev">📅 Következő esemény</div>
  <div>Betöltés...</div>
</div>
<div class="card" id="hetiProgram">
  <div class="nev">📅 Heti program</div>
  <div>Betöltés...</div>
</div>    
    <div class="card">
      <button onclick="kijelentkezes()">
        Kijelentkezés
      </button>
    </div>
  </div>

  <script>
    const API_URL =
  "https://script.google.com/macros/s/AKfycbyFmtgSTy0wAvMsjJzYBqNk32x7ET-_LDjWAQeDthfaEGxSYrmKtDc3B1wf_HKJIUxqKQ/exec";
    const nev = localStorage.getItem("mkfc_jatekos_nev");
    const token = localStorage.getItem("mkfc_jatekos_token");

    const csapatok = JSON.parse(
  localStorage.getItem("mkfc_jatekos_csapatok") || "[]"
);

const csapatIdk = csapatok
  .map(function(csapat) {
    return String(csapat.csapatId || "").trim();
  })
  .filter(Boolean);

    if (!nev || !token) {
      window.location.href = "index.html";
    } else {
      document.getElementById("jatekosNev").textContent = nev;
      kovetkezoEsemenyBetoltese();
    }
    
  async function kovetkezoEsemenyBetoltese() {
  const kartya = document.getElementById("kovetkezoEsemeny");
  const hetiKartya = document.getElementById("hetiProgram");
  try {
    const valasz = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        muvelet: "programAdatok",
        csapatId: csapatIdk.length > 0
          ? csapatIdk
          : ["MKFC-U19"]
      })
    });

    const adat = await valasz.json();

    if (!adat.siker) {
      throw new Error(adat.uzenet || "Nem sikerült lekérni az eseményeket.");
    }

    const esemenyek = Array.isArray(adat.esemenyek)
  ? adat.esemenyek
  : [];
    
const most = new Date();
    
const hetEleje = new Date(most);
hetEleje.setHours(0, 0, 0, 0);

const nap = hetEleje.getDay();
const hetfoEltolas = nap === 0 ? -6 : 1 - nap;
hetEleje.setDate(hetEleje.getDate() + hetfoEltolas);

const hetVege = new Date(hetEleje);
hetVege.setDate(hetVege.getDate() + 6);
hetVege.setHours(23, 59, 59, 999);
    
await reszvetelAllapotBetoltese("");   
const hetiEsemenyek = esemenyek
  .filter(function(esemeny) {
    const idopont = esemenyIdopont(esemeny);
    return idopont >= hetEleje && idopont <= hetVege;
  })
  .sort(function(a, b) {
    return esemenyIdopont(a) - esemenyIdopont(b);
  });
let hetiHtml = '<div class="nev">📅 Heti program</div>';

if (hetiEsemenyek.length === 0) {
  hetiHtml += '<div>Nincs esemény ezen a héten.</div>';
} 
hetiEsemenyek.forEach(function(esemeny) {
const hetiValasz = (window.reszvetelElozmenyek || []).find(function(elem) {
  return String(elem.esemenyId || "").trim() === String(esemeny.id || "").trim();
});  

let hetiValaszSzoveg = "⚪ Nincs visszajelzés";

if (hetiValasz) {
  if (hetiValasz.valasz === "Igen") {
    hetiValaszSzoveg = "✅ IGEN";
  } else if (hetiValasz.valasz === "Nem") {
    hetiValaszSzoveg =
      "❌ NEM" +
      (hetiValasz.indoklas
        ? " – " + hetiValasz.indoklas
        : "");
  }
}
  hetiHtml +=
    '<div class="hetiEsemenyElem" data-esemeny-id="' +
  esemeny.id +
  '" style="margin-top:12px; padding-top:12px; border-top:1px solid #ddd; cursor:pointer;">' +
      '<div><strong>' + (esemeny.tipus || "Esemény") + '</strong></div>' +
      '<div>📅 ' + (esemeny.datum || "") + '</div>' +
      '<div>⏰ ' + (esemeny.kezdes || "") + '</div>' +
      (esemeny.helyszin
        ? '<div>📍 ' + esemeny.helyszin + '</div>'
       : '') +
'<div style="margin-top:6px; font-weight:600;">' +
  hetiValaszSzoveg +
'</div>' +
'</div>';
}); 
    
hetiKartya.innerHTML = hetiHtml; 
document
  .querySelectorAll(".hetiEsemenyElem")
  .forEach(function(elem) {
    elem.addEventListener("click", function() {
  const esemenyId = elem.getAttribute("data-esemeny-id");
  hetiEsemenyMegnyitas(esemenyId);
});
  });
function hetiEsemenyMegnyitas(esemenyId) {
  const esemeny = (window.aktualisProgram || []).find(function(elem) {
    return String(elem.id || "").trim() === String(esemenyId || "").trim();
  });

  if (!esemeny) {
    return;
  }

  window.aktualisEsemeny = esemeny;

  esemenyReszletekMegjelenitese(esemeny);
} 
    
function esemenyReszletekMegjelenitese(esemeny) {
  if (!esemeny) {
   return;
  }
  const kartya = document.getElementById("kovetkezoEsemeny");

  if (!kartya) {
    return;
  }
 kartya.innerHTML =
  '<div class="nev">📅 Esemény részletei</div>' +
  '<div><strong>' + (esemeny.tipus || "Esemény") + '</strong></div>' +
  '<div>📅 ' + (esemeny.datum || "") + '</div>' +
  '<div>⏰ ' + (esemeny.kezdes || "") + '</div>' +
(esemeny.ellenfel
  ? '<div>⚽ <strong>Ellenfél:</strong> ' + esemeny.ellenfel + '</div>'
  : '') +
(esemeny.helyszin
  ? '<div>📍 <strong>Helyszín:</strong> ' + esemeny.helyszin + '</div>'
  : '') +
(esemeny.gyulekezo
  ? '<div>🕐 <strong>Gyülekező:</strong> ' + esemeny.gyulekezo + '</div>'
  : ''); 
} 
    
function esemenyIdopont(esemeny) {
  const datumReszek = String(esemeny.datum || "")
    .replace(/\.$/, "")
    .split(".");

  const idoReszek = String(esemeny.kezdes || "00:00")
    .split(":");

  return new Date(
    Number(datumReszek[0]),
    Number(datumReszek[1]) - 1,
    Number(datumReszek[2]),
    Number(idoReszek[0] || 0),
    Number(idoReszek[1] || 0)
  );
}

const kovetkezok = esemenyek
  .filter(function(esemeny) {
    return esemenyIdopont(esemeny) >= most;
  })
  .sort(function(a, b) {
    return esemenyIdopont(a) - esemenyIdopont(b);
  });

const e = kovetkezok[0];

 window.aktualisEsemeny = e;

await reszvetelAllapotBetoltese(e.id); 
    
const keretValasz = await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    muvelet: "jatekosMerkozesKeret",
    esemenyId: e.id,
    nev: nev
  })
});

window.aktualisMerkozesKeret = await keretValasz.json();    
if (!e) {
 
  kartya.innerHTML =
    '<div class="nev">📅 Következő esemény</div>' +
    '<div>Nincs közelgő esemény.</div>';
  return;
}
 const vanMarValasz =
    window.aktualisReszvetel &&
    window.aktualisReszvetel.esemenyId === e.id;
    
 const reszvetelAllapotSzoveg = vanMarValasz
  ? (
      window.aktualisReszvetel.valasz === "Igen"
        ? '<div style="margin-top:16px; font-weight:600;">✅ Részvétel: IGEN</div>'
        : '<div style="margin-top:16px; font-weight:600;">❌ Részvétel: NEM' +
          (window.aktualisReszvetel.indoklas
            ? '<br>Indok: ' + window.aktualisReszvetel.indoklas
            : '') +
          '</div>'
    )
  : "";  
   const keretAdat = window.aktualisMerkozesKeret;

const keretAllapotSzoveg =
  keretAdat &&
  keretAdat.siker &&
  keretAdat.benneVan
    ? '<div style="margin-top:14px;">' +
        '👕 <strong>Keret:</strong> ' +
        keretAdat.keretStatusz +
        (keretAdat.merkozesPoszt
          ? '<br>📍 <strong>Poszt:</strong> ' + keretAdat.merkozesPoszt
          : '') +
      '</div>'
    : ""; 
    kartya.innerHTML =
  '<div class="nev">📅 Következő esemény</div>' +
  '<div><strong>' + (e.tipus || "Esemény") + '</strong></div>' +
  '<div>📅 ' + (e.datum || "") + '</div>' +
  '<div>⏰ ' + (e.kezdes || "") + '</div>' +
  (e.ellenfel
    ? '<div>⚽ <strong>Ellenfél:</strong> ' + e.ellenfel + '</div>'
    : '') +
  (e.helyszin
  ? '<div>📍 <strong>Helyszín:</strong> ' + e.helyszin + '</div>'
  : '') +
(e.gyulekezo
  ? '<div>🕐 <strong>Gyülekező:</strong> ' + e.gyulekezo + '</div>'
  : '') +
  (e.meghivoUrl
  ? '<div style="margin-top:16px;">' +
      '<a href="' + e.meghivoUrl + '" target="_blank" ' +
      'style="display:block; text-align:center; text-decoration:none; ' +
      'background:#1f5b85; color:white; padding:14px 16px; ' +
      'border-radius:12px; font-weight:700; font-size:18px;">' +
      '📣 MÉRKŐZÉSMEGHÍVÓ' +
      '</a>' +
    '</div>'
  : '') +
   reszvetelAllapotSzoveg +
keretAllapotSzoveg +
(vanMarValasz
  ? ""
  : '<button type="button" id="reszvetelGomb" style="margin-top:16px;">Részvétel jelzése</button>');
     
  const reszvetelGomb = document.getElementById("reszvetelGomb");

if (reszvetelGomb) {
  reszvetelGomb.addEventListener("click", function() {
    reszvetelJelzes(e.id);
  });
}
        
  } catch (hiba) {
    
    kartya.innerHTML =
      '<div class="nev">📅 Következő esemény</div>' +
      '<div>Hiba: ' + hiba.message + '</div>';
  }
}
    
async function reszvetelAllapotBetoltese(esemenyId) {
  try {
    const valaszApi = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        muvelet: "reszvetelElozmenyek",
        nev: nev
      })
    });

    const adat = await valaszApi.json();

    window.reszvetelElozmenyek = adat.elozoValaszok || [];

    if (!adat.siker) {
      return;
    }

    const elozoValasz = (adat.elozoValaszok || []).find(function(elem) {
      return elem.esemenyId === esemenyId;
    });

    if (!elozoValasz) {
      return;
    }

    window.aktualisReszvetel = elozoValasz;
   const kartya = document.getElementById("kovetkezoEsemeny");
const reszvetelGomb = document.getElementById("reszvetelGomb");

if (reszvetelGomb) {
  reszvetelGomb.style.display = "none";
}

const allapot = document.createElement("div");
allapot.style.marginTop = "16px";
allapot.style.fontWeight = "600";

const foSor = document.createElement("div");

foSor.textContent =
  elozoValasz.valasz === "Igen"
    ? "✅ Korábbi visszajelzésed: Részt veszek"
    : "❌ Korábbi visszajelzésed: Nem veszek részt";

allapot.appendChild(foSor);

if (
  elozoValasz.valasz === "Nem" &&
  elozoValasz.indoklas
) {
  const indokSor = document.createElement("div");
  indokSor.textContent = "Indok: " + elozoValasz.indoklas;
  allapot.appendChild(indokSor);
}

kartya.appendChild(allapot);
  } catch (hiba) {
    console.error("Részvételi állapot betöltési hiba:", hiba);
  }
}
    
function reszvetelJelzes(esemenyId) {
  const kartya = document.getElementById("kovetkezoEsemeny");
  const reszvetelGomb = document.getElementById("reszvetelGomb");
  const igenGomb = document.getElementById("resztVeszekGomb");
  const nemGomb = document.getElementById("nemVeszekResztGomb");

if (reszvetelGomb) reszvetelGomb.disabled = true;
if (igenGomb) igenGomb.disabled = true;
if (nemGomb) nemGomb.disabled = true;

  kartya.innerHTML +=
    '<div style="margin-top:16px;">' +
      '<button type="button" id="resztVeszekGomb">✅ Részt veszek</button>' +
      '<button type="button" id="nemVeszekResztGomb" style="margin-top:10px;">❌ Nem veszek részt</button>' +
    '</div>';

 document
  .getElementById("resztVeszekGomb")
  .addEventListener("click", function() {
    reszvetelValaszMentese(esemenyId, "Igen");
  });

document
  .getElementById("nemVeszekResztGomb")
  .addEventListener("click", function() {
    const indoklas = prompt(
      "Kérlek írd le röviden, miért nem veszel részt:"
    );

    if (indoklas === null) {
      return;
    }

    if (!indoklas.trim()) {
      alert("Az indoklás megadása kötelező.");
      return;
    }

    reszvetelValaszMentese(
      esemenyId,
      "Nem",
      indoklas.trim()
    );
  });
}
    
async function reszvetelValaszMentese(esemenyId, valasz, indoklas = "") {
  try {
    
     const valaszApi = await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    muvelet: "reszvetelMentes",
    esemenyId: esemenyId,

    datum: window.aktualisEsemeny
      ? window.aktualisEsemeny.datum
      : "",

    tipus: window.aktualisEsemeny
      ? window.aktualisEsemeny.tipus
      : "",

    jatekos: nev,
    valasz: valasz,
    indoklas: indoklas
  })
});

    const adat = await valaszApi.json();

    if (!adat.siker) {
      throw new Error(adat.uzenet || "A mentés nem sikerült.");
    }

   const kartya = document.getElementById("kovetkezoEsemeny");
   const reszvetelGomb = document.getElementById("reszvetelGomb");
   const igenGomb = document.getElementById("resztVeszekGomb");
   const nemGomb = document.getElementById("nemVeszekResztGomb");

   if (reszvetelGomb) {
       reszvetelGomb.style.display = "none";
   }

   if (igenGomb) {
      igenGomb.style.display = "none";
   }

   if (nemGomb) {
      nemGomb.style.display = "none";
   }
kartya.insertAdjacentHTML(
  "beforeend",
  '<div style="margin-top:16px; font-weight:600;">' +
    (valasz === "Igen"
      ? "✅ Visszajelzésed rögzítve: Részt veszek"
      : "❌ Visszajelzésed rögzítve: Nem veszek részt" +
        (indoklas
          ? "<br>Indok: " + indoklas
          : "")
    ) +
  '</div>'
);

  } catch (hiba) {
    alert("Hiba: " + hiba.message);
  }
}  
    function kijelentkezes() {
      localStorage.removeItem("mkfc_jatekos_nev");
      localStorage.removeItem("mkfc_jatekos_token");

      window.location.href = "index.html";
    }
  </script>

</body>
</html>
