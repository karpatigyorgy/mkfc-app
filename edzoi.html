<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKFC – Edzői Központ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6f8;
      color: #111;
    }

    header {
      background: #19577f;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .card h2 {
      color: #19577f;
      margin-top: 0;
    }

    .menu-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #19577f;
      color: white;
      padding: 17px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
    }

    .status {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ MKFC – Edzői Központ</h1>
</header>

<div class="container">

  <div class="card">
    <h2>👤 Edző</h2>
    <div class="status">
      MKFC U19<br>
      Edzői kezelőfelület
    </div>
  </div>

  <div class="card">
    <h2>📅 Következő esemény</h2>
    <div class="status">
      Betöltés...
    </div>
  </div>

  <div class="card">
    <h2>⚽ Edzői menü</h2>

    <button class="menu-button">
      📅 Események
    </button>

    <button class="menu-button">
      👥 Játékosok
    </button>

    <button class="menu-button">
      ✅ Részvétel
    </button>

    <button class="menu-button">
      ⚽ Mérkőzés összeállítás
    </button>

    <button class="menu-button">
      📊 Statisztika
    </button>

  </div>

</div>

</body>
</html>
