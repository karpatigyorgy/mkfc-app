<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MKFC</title>

  <meta name="theme-color" content="#174a73">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .logo {
      width: 180px;
      max-width: 70%;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      color: #174a73;
    }

    p {
      color: #555;
      margin-bottom: 24px;
    }

    .button {
      display: block;
      text-decoration: none;
      background: #174a73;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="MKFC_logo.png" class="logo" alt="MKFC">

    <h1>MKFC</h1>
    <p>Edzői Központ</p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbyFmtgSTy0wAvMsjJzYBqNk32x7ET-_LDjWAQeDthfaEGxSYrmKtDc3B1wf_HKJIUxqKQ/exec"
    >
      Belépés
    </a>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
